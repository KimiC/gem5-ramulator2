Frontend:
  impl: LoadStoreTrace
  clock_ratio: 1
  path: /home/raftchen/workspace/gem5-ramulator2/ramulator_out/compare_10000/hammer_ddr4_10000.trace

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1000

  DRAM:
    impl: DDR4-VRR
    org:
      preset: DDR4_2Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR4_2400R

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: OracleRH
          tRH: 4
          debug: false
      - ControllerPlugin:
          impl: CommandCounter
          path: /home/raftchen/workspace/gem5-ramulator2/ramulator_out/compare_10000/ddr4_2400r_oracle.cmds
          commands_to_count:
            - ACT
            - PRE
            - RD
            - REFab
            - VRR

  AddrMapper:
    impl: RoBaRaCoCh
