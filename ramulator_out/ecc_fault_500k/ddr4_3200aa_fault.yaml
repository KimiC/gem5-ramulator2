Frontend:
  impl: LoadStoreTrace
  clock_ratio: 1
  path: /home/raftchen/workspace/gem5-ramulator2/ramulator_out/ecc_fault_500k/hammer_ddr4_500k.trace

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1000

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_2Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR4_3200AA

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: RowHammerFaultModel
          tRH: 4
          fault_probability: 0.5
          multi_bit_fault_probability: 0.03
          victim_radius: 1
          ecc: none
          seed: 1
          reset_on_refresh: true
          debug: false
          path: /home/raftchen/workspace/gem5-ramulator2/ramulator_out/ecc_fault_500k/ddr4_3200aa_fault.csv
      - ControllerPlugin:
          impl: CommandCounter
          path: /home/raftchen/workspace/gem5-ramulator2/ramulator_out/ecc_fault_500k/ddr4_3200aa_fault.cmds
          commands_to_count:
            - ACT
            - PRE
            - RD
            - REFab

  AddrMapper:
    impl: RoBaRaCoCh
